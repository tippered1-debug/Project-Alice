name: Apply Canonical Population Hard Cutover

on:
  push:
    branches:
      - feat/canonical-population-hard-cutover-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run scripted canonical population cutover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-population-hard-cutover-v1
          fetch-depth: 1
      - name: Cut over scripted population mutations
        run: python3 scripts/apply_canonical_script_population_cutover.py
      - name: Commit scripted cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/economy/demographics.hpp src/economy/demographics.cpp src/scripting/effects.cpp
          git diff --cached --check
          git commit -m 'Route scripted population mutations through canonical state'
          git push origin HEAD:feat/canonical-population-hard-cutover-v1
