name: Build Matrix

on:
  pull_request:
  push:

jobs:
  linux-build:
    strategy:
      matrix:
        config: [Debug]
        llvm-version: [20]
        compiler: [clang]
        os: [ubuntu-latest]

    env:
      CC: clang-${{ matrix.llvm-version }}
      CXX: clang++-${{ matrix.llvm-version }}

    name: Ubuntu with ${{ matrix.compiler }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Apt LLVM
      run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm-version }}
          sudo apt-get update

    - name: install Clang
      run: sudo apt install --no-install-recommends clang-${{ matrix.llvm-version }}

    - name: Install build and runtime-test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          git build-essential cmake \
          libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
          libxcursor-dev libxi-dev libicu-dev

    - name: Build Alice and run default runtime tests
      run: scripts/run_runtime_tests.sh

    # - name: Build Project Alice Incremental
    #   run: |
    #     cmake --build build --parallel --target AliceIncremental

  windows-build:
    strategy:
      matrix:
        config: [debug-windows]
    # This job configures with the Visual Studio 17 2022 generator below.
    runs-on: [windows-2022]
    name: Windows (${{ matrix.config }})
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Build Files
      run: |
        cmake -G "Visual Studio 17 2022" --preset=x64-${{ matrix.config }} -B build

    - name: Build Project Alice
      run: |
        cmake --build build --parallel --target Alice

    - name: Build Project Alice Incremental
      run: |
        cmake --build build --parallel --target AliceIncremental

  build-check:
    needs: [windows-build, linux-build]
    runs-on: ubuntu-latest
    name: Build Matrix
    steps:
      - name: Check
        run: |
          echo success
